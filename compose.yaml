services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CORS_ORIGINS: "*"
    ports:
      - "0.0.0.0:${API_HOST_PORT:-5000}:5000"
    depends_on:
      - mosquitto
    restart: unless-stopped

  simulator:
    build: ./simulator
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      EQUIPAMENTO_ID: CNC-01
      INTERVALO_SEGUNDOS: "2"
    depends_on:
      - mosquitto
    restart: unless-stopped
