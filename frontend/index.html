<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>RA | Manual Interativo do Robô Industrial</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
    </script>
</head>

<body>

    <header id="hud">

        <div class="hud-text">

            <strong>
                ROBÔ INDUSTRIAL • MANUAL INTERATIVO
            </strong>

            <span id="status">
                Inicializando a câmera...
            </span>

        </div>

        <span id="badge">
            INICIANDO
        </span>

    </header>

    <div id="hotspot-layer">

        <!-- Hotspot 1 - Base -->
        <button
            class="hotspot"
            type="button"
            data-topic="base"
            data-x="-0.25"
            data-y="-0.05"
            data-z="0.03"
            aria-label="Base do robô industrial">
            1
        </button>


        <!-- Hotspot 2 - Braço -->
        <button
            class="hotspot"
            type="button"
            data-topic="braco"
            data-x="-0.05"
            data-y="0.12"
            data-z="0.03"
            aria-label="Braço do robô industrial">
            2
        </button>


        <!-- Hotspot 3 - Punho -->
        <button
            class="hotspot"
            type="button"
            data-topic="punho"
            data-x="0.03"
            data-y="0.28"
            data-z="0.03"
            aria-label="Punho do robô industrial">
            3
        </button>


        <!-- Hotspot 4 - Garra -->
        <button
            class="hotspot hotspot-danger"
            type="button"
            data-topic="garra"
            data-x="0.03"
            data-y="0.42"
            data-z="0.03"
            aria-label="Garra do robô industrial">
            4
        </button>

    </div>

    <section
        id="info-panel"
        class="info-panel hidden"
        aria-live="polite">

        <button
            id="close-panel"
            class="close-button"
            type="button"
            aria-label="Fechar painel">
            ×
        </button>

        <small>
            PONTO DO ROBÔ
        </small>

        <h2 id="info-title">
            Componente
        </h2>

        <p id="info-text">
            Descrição.
        </p>

        <p
            id="info-detail"
            class="detail">
            Detalhe.
        </p>

    </section>

    <a-scene
        id="ar-scene"

        mindar-image="
            imageTargetSrc: assets/targets/robo_industrial.mind;
            autoStart: true;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            alpha: true;
        "

        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded>

        <a-camera
            id="ar-camera"
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity
            id="target"
            mindar-image-target="targetIndex: 0">
        </a-entity>

    </a-scene>

    <script src="js/app.js"></script>

</body>

</html>
